[pytest]
norecursedirs =
    backend/tests/tmp
markers =
    alpaca_paper_smoke: opt-in Voting Ensemble Alpaca Paper smoke tests disabled by default
    voting_ensemble: Voting Ensemble algorithm backend tests
    weighted_voting: Weighted Voting algorithm backend tests
    wca: WCA algorithm backend tests
    regime: Regime algorithm backend tests
    meta_strategy: Meta-Strategy algorithm backend tests
